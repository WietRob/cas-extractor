name: resolution-gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml pytest
      - run: python tests/resolvers/test_resolution_engine_regressions.py -v
      - run: python scripts/check_resolution_gates.py
