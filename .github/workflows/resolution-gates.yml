name: resolution-gates

on:
  push:
  pull_request:

jobs:
  unit-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml pytest

      - name: Run unit regression tests
        run: |
          python -m pytest tests/resolvers/test_resolution_engine_regressions.py -v --tb=short

  artifact-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml pytest

      - name: Run artifact-level integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short

  golden-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml pytest

      - name: Run resolution gate checks
        run: python scripts/check_resolution_gates.py

      - name: Check golden manifest
        run: |
          python scripts/build_golden_manifest.py sprint-v050-engine/06-golden/v050-product-baseline --check

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            **/*.log
            **/pytest-*.xml
            **/.pytest_cache
          retention-days: 7
