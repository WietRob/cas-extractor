name: resolution-gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml pytest

      - name: Run regression tests
        id: tests
        run: |
          python -m pytest tests/resolvers/test_resolution_engine_regressions.py -v --tb=short
        continue-on-error: true

      - name: Run resolution gate checks
        id: gates
        run: python scripts/check_resolution_gates.py
        continue-on-error: true

      - name: Check golden manifest
        id: manifest
        run: |
          python scripts/build_golden_manifest.py sprint-v050-engine/06-golden/v050-product-baseline --check
        continue-on-error: true

      - name: Aggregate results
        run: |
          if [[ "${{ steps.tests.outcome }}" != "success" ]]; then
            echo "::error::Regression tests failed"
            exit 1
          fi
          if [[ "${{ steps.gates.outcome }}" != "success" ]]; then
            echo "::error::Resolution gate checks failed"
            exit 1
          fi
          if [[ "${{ steps.manifest.outcome }}" != "success" ]]; then
            echo "::error::Golden manifest check failed"
            exit 1
          fi
          echo "All checks passed"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            **/*.log
            **/pytest-*.xml
            **/.pytest_cache
          retention-days: 7
